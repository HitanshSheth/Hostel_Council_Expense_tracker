<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="addexpense.css">
</head>
<body>
    <div class="box" style="height: auto; padding: 3em; gap: 2vh 0;">
        <h2 id="formTitle">Login</h2>
        <div>
            <label>Username:</label>
            <input type="text" id="username">
        </div>
        <div>
            <label>Password:</label>
            <input type="password" id="password">
        </div>
        <div class="add" style="position: static; display: flex; gap: 1em; align-items: center;">
            <button id="submitBtn">Login</button>
            <span id="toggleMode" style="cursor: pointer; color: rgb(137, 104, 255); font-size: 1rem;">
                Need an account? Register
            </span>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
